name: Docker Build & Push

on:
  workflow_call:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          contexts: .
          push: true
          tags: |
            ${{vars.DOCKERHUB_USERNAME}}/github-flask-app:${{github.ref_name}}
            ${{vars.DOCKERHUB_USERNAME}}/github-flask-app:latest
            ${{vars.DOCKERHUB_USERNAME}}/github-flask-app:${{github.sha}}

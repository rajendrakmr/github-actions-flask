name: Secrets Scan

on:
  workflow_call:

jobs:
  secrets_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
            fetch-depth: 0

      - name: Run GitLeaks scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
